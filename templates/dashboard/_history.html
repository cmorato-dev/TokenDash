{% load i18n %}
{# «Limits over time»: the dashboard and the Home Assistant module share it. #}
<section class="panel{% if not embed %} mt-6{% endif %}">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div><h2 class="text-xl font-semibold">{% translate "Limits over time" %}</h2><p class="mt-1 text-sm text-slate-400">{% translate "Average of the percentage observed per quota. Resets can lower the value." %}</p></div>
    <label class="text-sm text-slate-400">{% translate "Period" %} <select id="history-days" class="field ml-2"><option value="7">{% translate "7 days" %}</option><option value="30">{% translate "30 days" %}</option><option value="90">{% translate "3 months" %}</option><option value="182">{% translate "6 months" %}</option><option value="365">{% translate "1 year" %}</option><option value="1825">{% translate "5 years" %}</option></select></label>
  </div>
  <div id="history" class="history" aria-label="{% translate 'Usage history' %}"></div>
  <div id="history-legend" class="mt-4 flex flex-wrap gap-5 text-sm text-slate-400"></div>
  <p id="history-note" class="mt-3 text-xs leading-6 text-slate-500"></p>
</section>
