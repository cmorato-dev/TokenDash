{% extends 'base.html' %}
{% block content %}
<section class="panel mx-auto max-w-md">
  <p class="eyebrow">ACCESO PRIVADO</p>
  <h1 class="mt-3 text-3xl font-semibold">Tu consumo, de un vistazo.</h1>
  <p class="mt-4 text-sm text-slate-400">Inicia sesión con tu usuario de TokenDash.</p>
  {% if form.errors %}<p role="alert" class="mt-5 text-amber-300">Usuario o contraseña incorrectos.</p>{% endif %}
  <form method="post" class="mt-6 grid gap-4">
    {% csrf_token %}
    <label class="grid gap-2 text-sm" for="id_username">Usuario<input class="field" id="id_username" name="username" autocomplete="username" required autofocus></label>
    <label class="grid gap-2 text-sm" for="id_password">Contraseña<input class="field" id="id_password" name="password" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="action mt-2" type="submit">Entrar al panel →</button>
  </form>
</section>
{% endblock %}
