{% extends 'base.html' %}
{% block content %}
<section class="panel mx-auto max-w-md">
  <p class="eyebrow">TU CUENTA</p>
  <h1 class="mt-3 text-3xl font-semibold">Contraseña cambiada</h1>
  <p class="mt-4 text-sm text-slate-400">La próxima vez entra con la contraseña nueva.</p>
  {% if user.is_staff %}<p class="mt-4 text-sm text-slate-400">En <a class="text-emerald-300 hover:text-white" href="{% url 'admin:auth_user_changelist' %}">Administración → Usuarios</a> puedes cambiar tu nombre de usuario o crear usuarios nuevos.</p>{% endif %}
  <p class="mt-6"><a class="action inline-block" href="/">Ir al panel →</a></p>
</section>
{% endblock %}
